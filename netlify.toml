[build]
  # Primero se preparan las hojas de estilo originales (junta css-original/ en
  # public/css/) y despues se compila. Si se compilara sin ese paso, la web
  # saldria sin los estilos del tema.
  command = "npm run css && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------- seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ------------------------------------------------------------------- cache
# Las rutas de /wp-content/uploads/ no cambian nunca: se cachean un ano.
[[headers]]
  for = "/wp-content/uploads/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --------------------------------------------------------------- indexacion
# MIENTRAS el dominio casascontenedores.es siga apuntando al hosting viejo,
# esta cabecera impide que Google indexe la copia de Netlify y la tome por
# contenido duplicado. SE QUITA EL DIA DEL CAMBIO DE DNS: borra este bloque
# entero, sube el cambio y comprueba con "curl -I https://casascontenedores.es"
# que ya no aparece X-Robots-Tag.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
