[build]
  # Font Awesome sale de npm a public/fontawesome/ (no esta en Git) y despues
  # se compila. Todo lo demas que compila esta en Git (src/ y public/).
  command = "npm run fuentes && npm run hojas && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------- seguridad
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# ------------------------------------------------------------------- cache
# Las rutas de /wp-content/ no cambian nunca: se cachean un ano.
[[headers]]
  for = "/wp-content/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fontawesome/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Las hojas reunidas (/css/r-<hash>.css): el nombre cambia si cambia la lista
# de hojas que reunen, y cada hoja lleva su ?ver=, asi que tambien un ano.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --------------------------------------------------------------- indexacion
# MIENTRAS el dominio www.valenciaandgo.com siga apuntando al hosting viejo,
# esta cabecera impide que Google indexe la copia de Netlify y la tome por
# contenido duplicado. SE QUITA EL DIA DEL CAMBIO DE DNS: borra este bloque
# entero, sube el cambio y comprueba con "curl -I https://www.valenciaandgo.com"
# que ya no aparece X-Robots-Tag.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
